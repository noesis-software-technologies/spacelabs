name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff (lint)
        run: ruff check .

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # faster-whisper est optionnel (import paresseux, Sprint 7) et lourd :
        # on l'exclut de la CI, comme dans l'env de test de référence.
        run: |
          python -m pip install --upgrade pip
          grep -v "faster-whisper" requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
          pip install pytest-django pytest-asyncio factory-boy django-debug-toolbar

      - name: Django system check
        run: python manage.py check

      - name: Migrations up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        # dev = SQLite + InMemoryChannelLayer : aucun daemon Redis requis.
        run: python -m pytest -q
