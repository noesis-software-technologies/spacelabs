<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpaceLabs — L'humain conduit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#FFFFFF;color:#000;font-family:'Inter',system-ui,-apple-system,sans-serif}
nav{display:flex;justify-content:space-between;align-items:center;padding:26px 48px;border-bottom:1px solid #F5F5F5}
.logo{font-weight:700;letter-spacing:.02em;font-size:17px}
.links{display:flex;gap:30px;align-items:center}
.links a{color:#888;text-decoration:none;font-size:14px;transition:.2s}
.links a:hover{color:#000}
.nbtn{background:#000;color:#fff;border-radius:999px;padding:11px 24px;font-size:14px;text-decoration:none}
.hero{min-height:calc(100vh - 74px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 24px 40px}
.head{position:relative;max-width:600px}
h1{font-size:clamp(64px,12vw,150px);font-weight:600;line-height:.92;letter-spacing:-.05em}
.ghost{font-size:clamp(64px,12vw,150px);font-weight:600;line-height:.92;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px #000;text-stroke:1px #000;margin-top:6px}
.sep{width:60%;max-width:700px;height:1px;background:#000;margin:56px auto}
.cols{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px;max-width:1000px;width:100%}
.cols .l{text-align:left;font-size:14px;line-height:1.7;color:#333;max-width:260px}
.badges{display:flex;gap:0;justify-content:center;align-items:center;font-size:13px;color:#888;letter-spacing:.04em}
.badges b{color:#000;font-weight:600}
.badges .d{margin:0 12px;color:#888}
.cols .r{text-align:right}
.cta{display:inline-block;background:#000;color:#fff;border-radius:999px;padding:14px 30px;font-size:14px;text-decoration:none;transition:.2s}
.cta:hover{background:#333}
@media(max-width:760px){.cols{grid-template-columns:1fr;text-align:center}.cols .l,.cols .r{text-align:center;margin:0 auto}}
</style>
</head>
<body>
<nav>
<div class="logo">SpaceLabs</div>
<div class="links">
<a href="{% url 'comptes:login' %}">Connexion</a>
<a href="{% url 'workspaces:home' %}">Cockpit</a>
<a class="nbtn" href="{% url 'workspaces:home' %}">Démarrer</a>
</div>
</nav>
<div class="hero">
<div class="head">
<h1>L'humain<br>conduit.</h1>
<div class="ghost">la machine<br>exécute.</div>
</div>
<div class="sep"></div>
<div class="cols">
<div class="l">Multi-agent Claude, piloté à la voix, diffusable en direct. Vous décidez, seize agents exécutent en parallèle.</div>
<div class="badges"><b>Spawn</b><span class="d">·</span><b>Dispatch</b><span class="d">·</span><b>Monitor</b></div>
<div class="r"><a class="cta" href="{% url 'workspaces:home' %}">Entrer →</a></div>
</div>
</div>
</body>
</html>
