<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Duesenberg — SpaceLabs</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#ffffff;
      --surface:#f8f8f9;
      --card:#ffffff;
      --border:#e8e8ec;
      --ink:#111113;
      --muted:#6b6b78;
      --faint:#a0a0ad;
      --accent:#f77615;
      --accent-soft:#fff4ec;
      --accent-border:#fde0c7;
      --good:#15a159;
      --good-soft:#edfaf4;
      --warn:#d4790a;
      --warn-soft:#fff8ec;
      --crit:#dc2626;
      --crit-soft:#fff1f1;
      --font:Inter,-apple-system,system-ui,sans-serif;
      --mono:"SF Mono","JetBrains Mono",ui-monospace,monospace;
      --radius:12px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overscroll-behavior:none}
    body{
      font-family:var(--font);
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }
    #app{
      max-width:480px;
      margin:0 auto;
      padding:env(safe-area-inset-top,12px) 0 40px;
    }

    /* ── Header ── */
    .hdr{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 16px 10px;
      border-bottom:1px solid var(--border);
      background:var(--bg);
      position:sticky;top:0;z-index:10;
    }
    .hdr-brand{display:flex;align-items:center;gap:8px}
    .hdr-logo{
      width:30px;height:30px;border-radius:8px;
      background:var(--accent);
      display:flex;align-items:center;justify-content:center;
      font:700 13px var(--font);color:#fff;letter-spacing:-.02em
    }
    .hdr-title{font:700 15px/1 var(--font);letter-spacing:-.02em;color:var(--ink)}
    .hdr-sub{font:400 11px var(--mono);color:var(--faint);margin-top:2px}
    .refresh-btn{
      width:32px;height:32px;border-radius:8px;
      background:var(--surface);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;color:var(--muted);
    }
    .refresh-btn:active{background:var(--border)}
    .refresh-btn svg{width:15px;height:15px}

    /* ── KPI grid ── */
    .kpi-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      padding:14px 12px 0;
    }
    .kpi{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 11px;
      min-height:62px;
    }
    .kpi b{
      display:block;
      font:700 17px/1.2 var(--font);
      letter-spacing:-.03em;
      color:var(--ink);
      margin-bottom:3px;
    }
    .kpi span{
      font:500 10px var(--mono);
      color:var(--faint);
      text-transform:uppercase;
      letter-spacing:.04em;
    }
    .kpi.accent b{color:var(--accent)}
    .kpi.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 20%,transparent)}
    .kpi.good b{color:var(--good)}
    .kpi.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 20%,transparent)}
    .kpi.warn b{color:var(--warn)}
    .kpi.crit{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 20%,transparent)}
    .kpi.crit b{color:var(--crit)}
    .kpi.wide{grid-column:span 2}
    .kpi-row2{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
      padding:8px 12px 0;
    }

    /* ── Section ── */
    .section{margin-top:18px;padding:0 12px}
    .sec-title{
      font:700 11px var(--mono);
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--faint);
      margin-bottom:8px;
    }

    /* ── Order card ── */
    .order-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      overflow:hidden;
      margin-bottom:8px;
    }
    .order-head{
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .order-head:active{background:var(--surface)}
    .order-thumb{
      width:38px;height:38px;border-radius:7px;
      background:var(--surface);
      border:1px solid var(--border);
      flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font:20px serif;
      overflow:hidden;
    }
    .order-thumb img{width:100%;height:100%;object-fit:cover}
    .order-info{flex:1;min-width:0}
    .order-titre{
      font:600 13px/1.3 var(--font);
      color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .order-meta{
      display:flex;align-items:center;gap:6px;
      margin-top:3px;
      flex-wrap:wrap;
    }
    .order-date{font:400 11px var(--mono);color:var(--faint)}
    .spill{
      font:500 10px var(--mono);
      padding:2px 6px;
      border-radius:4px;
      border:1px solid transparent;
      white-space:nowrap;
    }
    .spill-prep{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 20%,transparent)}
    .spill-exp{background:#f0edff;color:#7c3aed;border-color:#ddd6fe}
    .spill-liv{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 20%,transparent)}
    .spill-clo{background:var(--surface);color:var(--faint);border-color:var(--border)}
    .order-right{text-align:right;flex-shrink:0}
    .order-pv{font:700 14px var(--font);color:var(--ink)}
    .order-benef{font:500 11px var(--mono);color:var(--good);margin-top:2px}
    .order-benef.neg{color:var(--crit)}
    .order-expand{
      color:var(--faint);
      font:500 11px var(--mono);
      margin-top:2px;
    }
    .order-expand::after{content:" ▸";font-size:.85em;display:inline-block;transition:transform .15s}
    .order-card.open .order-expand::after{transform:rotate(90deg)}

    /* ── Lines detail ── */
    .order-lines{
      display:none;
      border-top:1px solid var(--border);
      background:var(--surface);
      padding:0;
    }
    .order-card.open .order-lines{display:block}
    .line-row{
      display:flex;align-items:center;gap:8px;
      padding:7px 12px;
      border-bottom:1px solid var(--border);
      font:400 12px var(--font);
    }
    .line-row:last-child{border-bottom:none}
    .line-thumb{
      width:26px;height:26px;border-radius:5px;
      background:var(--border);border:1px solid var(--border);
      flex-shrink:0;display:flex;align-items:center;justify-content:center;
      font:12px serif;overflow:hidden;
    }
    .line-thumb img{width:100%;height:100%;object-fit:cover}
    .line-name{flex:1;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .line-pv{font:500 12px var(--mono);color:var(--muted);min-width:38px;text-align:right}
    .line-benef{font:600 12px var(--mono);color:var(--good);min-width:38px;text-align:right}
    .line-benef.neg{color:var(--crit)}
    .line-benef.unk{color:var(--faint);font-weight:400}
    .remise-row{
      display:flex;justify-content:space-between;
      padding:6px 12px;
      font:500 11px var(--mono);
      color:var(--warn);
      background:var(--warn-soft);
      border-top:1px solid color-mix(in srgb,var(--warn) 15%,transparent);
    }
    .total-row{
      display:flex;justify-content:space-between;
      padding:7px 12px;
      font:600 12px var(--mono);
      color:var(--accent);
      background:var(--accent-soft);
      border-top:1px solid var(--accent-border);
    }

    /* ── Empty / loading ── */
    .loading{text-align:center;padding:40px 16px;color:var(--faint);font:.85rem var(--font)}
    .spinner{
      width:20px;height:20px;border-radius:50%;
      border:2px solid var(--border);
      border-top-color:var(--accent);
      animation:spin .7s linear infinite;
      display:inline-block;vertical-align:middle;margin-right:8px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Tracking ── */
    .tracking-row{
      padding:6px 12px;
      font:400 11px var(--mono);
      color:var(--muted);
      background:var(--surface);
      border-top:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;gap:8px;
    }
    .tracking-link{color:var(--accent);text-decoration:none;font-weight:500}
    .tracking-link:hover{text-decoration:underline}
  </style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="hdr-brand">
      <div class="hdr-logo">SL</div>
      <div>
        <div class="hdr-title">Duesenberg</div>
        <div class="hdr-sub" id="hdr-update">Chargement…</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button id="projBtn" title="Projection" onclick="toggleView('proj')"
        style="padding:6px 12px;border-radius:8px;border:1.5px solid var(--accent-border);background:var(--accent-soft);font:700 .78rem var(--font);color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;">
         Simulation
      </button>
      <button class="refresh-btn" id="refreshBtn" title="Actualiser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      </button>
    </div>
  </header>

  <!-- Tab: Dashboard ventes -->
  <div id="content"><div class="loading"><span class="spinner"></span>Chargement…</div></div>

  <!-- Tab: Projection commerciale (inline, no iframe) -->
  <div id="proj-content" style="display:none;overflow-y:auto;height:calc(100vh - 56px);padding-bottom:40px;">
    <!-- KPI bar -->
    <div id="proj-kpi" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 14px;background:#1a1a2e;position:sticky;top:0;z-index:5;">
      <div style="text-align:center;"><div id="pk-nb" style="font-size:1.05rem;font-weight:900;color:#fff;">—</div><div style="font-size:.6rem;color:#9ca3af;text-transform:uppercase;margin-top:2px;">Articles</div></div>
      <div style="text-align:center;"><div id="pk-pa" style="font-size:1.05rem;font-weight:900;color:#fff;">—</div><div style="font-size:.6rem;color:#9ca3af;text-transform:uppercase;margin-top:2px;">Coût PA</div></div>
      <div style="text-align:center;"><div id="pk-pv" style="font-size:1.05rem;font-weight:900;color:#4ade80;">—</div><div style="font-size:.6rem;color:#9ca3af;text-transform:uppercase;margin-top:2px;">CA projeté</div></div>
      <div style="text-align:center;"><div id="pk-benef" style="font-size:1.05rem;font-weight:900;color:#4ade80;">—</div><div style="font-size:.6rem;color:#9ca3af;text-transform:uppercase;margin-top:2px;">Bénéfice</div></div>
    </div>
    <!-- Controls -->
    <div style="padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e9ecef;background:#fff;position:sticky;top:60px;z-index:4;">
      <span style="font-size:.78rem;font-weight:600;color:#6c757d;">Marge</span>
      <div style="display:flex;align-items:center;gap:4px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:7px;padding:5px 8px;">
        <input type="number" id="proj-marge" value="40" min="0" max="999" step="1"
          style="width:44px;border:none;background:transparent;font-size:.95rem;font-weight:800;color:#4f46e5;text-align:center;outline:none;"
          oninput="projRefresh()">
        <span style="font-size:.8rem;font-weight:700;color:#4f46e5;">%</span>
      </div>
      <div style="margin-left:auto;display:flex;gap:5px;">
        <button onclick="projSelectAll()" style="padding:4px 9px;border-radius:6px;border:none;background:#4f46e5;color:#fff;font-size:.72rem;font-weight:600;cursor:pointer;">Tout</button>
        <button onclick="projSelectNone()" style="padding:4px 9px;border-radius:6px;border:none;background:#e9ecef;color:#1a1a2e;font-size:.72rem;font-weight:600;cursor:pointer;">Aucun</button>
      </div>
    </div>
    <!-- Items list -->
    <div id="proj-items" style="padding:8px 14px;display:flex;flex-direction:column;gap:5px;">
      <div style="text-align:center;padding:30px;color:#adb5bd;font-size:.85rem;">Chargement…</div>
    </div>
  </div>
</div>

<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(tg){
    tg.ready();
    tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#ffffff');
    tg.setBackgroundColor && tg.setBackgroundColor('#ffffff');
  }

  const STATUT_LABEL = {a_preparer:'À préparer',etiquette:'Étiquette',expedie:'Expédié',livre:'Livré',cloture:'Clôturé',probleme:'Problème'};
  const STATUT_CLASS = {a_preparer:'spill-prep',etiquette:'spill-exp',expedie:'spill-exp',livre:'spill-liv',cloture:'spill-clo',probleme:'spill-clo'};

  function fmt(v){return v?parseFloat(v).toFixed(2):'—'}
  function fmtDate(s){if(!s)return'';const d=new Date(s);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}

  function renderKpis(kpis){
    const warnA = kpis.a_preparer > 0;
    return `
    <div class="kpi-grid">
      <div class="kpi good wide"><b>${fmt(kpis.ca)} €</b><span>CA total</span></div>
      <div class="kpi"><b>${kpis.nb_commandes}</b><span>Commandes</span></div>
    </div>
    <div class="kpi-row2">
      <div class="kpi good"><b>${fmt(kpis.benefice)} €</b><span>Bénéfice net</span></div>
      <div class="kpi ${kpis.marge !== null && kpis.marge >= 20 ? 'good' : kpis.marge !== null ? 'warn' : ''}"><b>${kpis.marge !== null ? kpis.marge + ' %' : '—'}</b><span>Marge moy.</span></div>
      <div class="kpi ${warnA ? 'warn' : ''}"><b>${kpis.a_preparer}</b><span>À expédier</span></div>
      <div class="kpi"><b>${kpis.en_transit}</b><span>En transit</span></div>
    </div>`;
  }

  function renderOrder(o, forceOpen){
    const statClass = STATUT_CLASS[o.statut] || 'spill-clo';
    const statLabel = STATUT_LABEL[o.statut] || o.statut_label || o.statut;
    const pv = o.prix_vente ? fmt(o.prix_vente) + ' €' : '—';
    const bv = parseFloat(o.benefice);
    const bvStr = isNaN(bv) ? '—' : (bv >= 0 ? '+' : '') + bv.toFixed(2) + ' €';
    const bvNeg = !isNaN(bv) && bv < 0;
    const multiligne = o.lignes && o.lignes.length > 1;

    // thumbnail: first line with photo
    let thumb = '🃏';
    if(o.lignes){
      const withPhoto = o.lignes.find(l => l.photo);
      if(withPhoto) thumb = `<img src="${withPhoto.photo}" alt="" loading="lazy">`;
    }

    let linesHtml = '';
    if(o.lignes && o.lignes.length > 0){
      const rows = o.lignes.map(l => {
        const lpv = l.prix_vente ? fmt(l.prix_vente) + ' €' : '—';
        const lb = l.benefice !== null ? (l.benefice >= 0 ? '+' : '') + parseFloat(l.benefice).toFixed(2) + ' €' : '?';
        const lbClass = l.benefice === null ? 'unk' : l.benefice < 0 ? 'neg' : '';
        const lthumb = l.photo ? `<img src="${l.photo}" alt="">` : '🃏';
        return `<div class="line-row">
          <div class="line-thumb">${lthumb}</div>
          <span class="line-name">${l.designation}</span>
          <span class="line-pv">${lpv}</span>
          <span class="line-benef ${lbClass}">${lb}</span>
        </div>`;
      }).join('');

      const remise = o.remise ? `<div class="remise-row"><span>Remise lot</span><span>−${fmt(o.remise)} €</span></div>` : '';
      const total = `<div class="total-row"><span>Total encaissé</span><span>${pv}</span></div>`;
      linesHtml = `<div class="order-lines">${rows}${remise}${total}</div>`;
    }

    const expandHint = multiligne ? `<div class="order-expand">${o.lignes.length} articles</div>` : '';
    const openClass = (forceOpen || multiligne) && o.lignes && o.lignes.length > 1 ? ' open' : '';

    return `<div class="order-card${openClass}" data-id="${o.id}">
      <div class="order-head">
        <div class="order-thumb">${thumb}</div>
        <div class="order-info">
          <div class="order-titre">${o.titre}</div>
          <div class="order-meta">
            <span class="order-date">${fmtDate(o.date)}</span>
            <span class="spill ${statClass}">${statLabel}</span>
          </div>
          ${expandHint}
        </div>
        <div class="order-right">
          <div class="order-pv">${pv}</div>
          <div class="order-benef ${bvNeg ? 'neg' : ''}">${bvStr}</div>
        </div>
      </div>
      ${linesHtml}
    </div>`;
  }

  function render(data){
    const {kpis, a_preparer, recentes} = data;
    let html = renderKpis(kpis);

    if(a_preparer && a_preparer.length){
      html += `<div class="section"><div class="sec-title">À expédier · ${a_preparer.length}</div>`;
      a_preparer.forEach(o => { html += renderOrder(o, true); });
      html += '</div>';
    }

    html += `<div class="section"><div class="sec-title">Dernières ventes</div>`;
    if(recentes && recentes.length){
      recentes.forEach(o => { html += renderOrder(o, false); });
    } else {
      html += '<div class="loading">Aucune vente enregistrée.</div>';
    }
    html += '</div>';

    document.getElementById('content').innerHTML = html;
    document.getElementById('hdr-update').textContent = 'Mis à jour ' + new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

    // toggles
    document.querySelectorAll('.order-card[data-id]').forEach(card => {
      const head = card.querySelector('.order-head');
      if(!head) return;
      head.addEventListener('click', () => {
        const hasLines = card.querySelector('.order-lines');
        if(hasLines) card.classList.toggle('open');
      });
    });
  }

  function load(){
    document.getElementById('hdr-update').textContent = 'Actualisation…';
    fetch('/vinted/duesenberg/api/')
      .then(r => r.json())
      .then(render)
      .catch(() => {
        document.getElementById('content').innerHTML = '<div class="loading">Erreur de chargement. Réessaie.</div>';
        document.getElementById('hdr-update').textContent = 'Erreur';
      });
  }

  let currentView = 'dashboard';
  window.toggleView = function(view) {
    if (view === 'proj' && currentView === 'proj') { view = 'dashboard'; }
    currentView = view;
    document.getElementById('content').style.display = view === 'dashboard' ? '' : 'none';
    document.getElementById('proj-content').style.display = view === 'proj' ? '' : 'none';
    const btn = document.getElementById('projBtn');
    btn.style.background = view === 'proj' ? 'var(--accent-soft)' : 'var(--surface)';
    btn.style.borderColor = view === 'proj' ? 'var(--accent-border)' : 'var(--border)';
    document.getElementById('hdr-update').textContent = view === 'proj' ? 'Projection commerciale' : '';
    if (view === 'dashboard') load();
    if (view === 'proj') { if (!projItems.length) projLoad(); else projRefresh(); }
  };

  document.getElementById('refreshBtn').addEventListener('click', load);
  load();

  // ── Projection simulator (inline, no iframe) ──
  let projItems = [], projSelected = new Set();
  const STATUT_LBL = {en_transit:'En transit',recu:'Reçu',a_grader:'À grader',en_gradation:'En gradation',grade:'Gradé',a_lister:'À lister',liste:'Listé'};
  const STATUT_ORDER = ['en_transit','recu','a_grader','en_gradation','grade','a_lister','liste'];

  function projLoad() {
    fetch('/vinted/projection/api/?marge=0')
      .then(r => r.json())
      .then(data => {
        projItems = data.items || [];
        projSelected = new Set(projItems.map(i => i.id));
        projRefresh();
      })
      .catch(() => {
        document.getElementById('proj-items').innerHTML = '<div style="text-align:center;padding:30px;color:#ef4444;">Erreur de chargement.</div>';
      });
  }

  function projRefresh() {
    const marge = parseFloat(document.getElementById('proj-marge').value) || 0;
    let pa_tot = 0, pv_tot = 0, nb = 0;

    // Group by statut
    const groups = {};
    projItems.forEach(item => {
      if (!groups[item.statut]) groups[item.statut] = [];
      groups[item.statut].push(item);
    });

    let html = '';
    STATUT_ORDER.forEach(st => {
      if (!groups[st]) return;
      html += `<div style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#adb5bd;padding:8px 0 3px;">${STATUT_LBL[st]||st} (${groups[st].length})</div>`;
      groups[st].forEach(item => {
        const sel = projSelected.has(item.id);
        const pv = Math.round(item.pa * (1 + marge/100) * 100) / 100;
        const benef = Math.round((pv - item.pa) * 100) / 100;
        if (sel) { pa_tot += item.pa; pv_tot += pv; nb++; }
        html += `<div onclick="projToggle(${item.id})" style="display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid ${sel?'#818cf8':'#e9ecef'};background:${sel?'#eef2ff':'#fff'};cursor:pointer;-webkit-tap-highlight-color:transparent;">
          <input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();projToggle(${item.id})" style="width:15px;height:15px;accent-color:#4f46e5;flex-shrink:0;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:.8rem;font-weight:600;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.nom}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-size:.68rem;color:#6c757d;">PA ${item.pa.toFixed(2)}€</div>
            <div style="font-size:.88rem;font-weight:800;color:#4f46e5;">${pv.toFixed(2)}€</div>
            <div style="font-size:.68rem;font-weight:600;color:#15803d;">+${benef.toFixed(2)}€</div>
          </div>
        </div>`;
      });
    });
    document.getElementById('proj-items').innerHTML = html || '<div style="text-align:center;padding:30px;color:#adb5bd;">Entrepôt vide.</div>';

    const benef_tot = pv_tot - pa_tot;
    document.getElementById('pk-nb').textContent = nb;
    document.getElementById('pk-pa').textContent = pa_tot.toFixed(0) + '€';
    document.getElementById('pk-pv').textContent = pv_tot.toFixed(0) + '€';
    document.getElementById('pk-benef').textContent = '+' + benef_tot.toFixed(0) + '€';
  }

  window.projToggle = function(id) {
    if (projSelected.has(id)) projSelected.delete(id); else projSelected.add(id);
    projRefresh();
  };
  window.projSelectAll = function() { projSelected = new Set(projItems.map(i => i.id)); projRefresh(); };
  window.projSelectNone = function() { projSelected = new Set(); projRefresh(); };
})();
</script>
</body>
</html>
