<div class="explorer" id="explorer">
  <div class="explorer-head">
    <span class="explorer-name">
      <svg class="ds-icon ds-icon--xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
      {{ cwd|default:workspace.cwd }}
    </span>
  </div>
  {% if error %}<p class="ds-error">{{ error }}</p>{% endif %}
  <div class="explorer-tree">
    {% if parent is not None %}
      <button type="button" class="tree-node" data-kind="folder"
              hx-get="{% url 'workspaces:explorer' slug=workspace.slug %}?path={{ parent|urlencode }}"
              hx-target="#explorer" hx-swap="outerHTML">
        <span class="tree-icon">
          <svg class="ds-icon ds-icon--xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </span>..
      </button>
    {% endif %}
    {% for entry in entries %}
      {% if entry.is_dir %}
        <button type="button" class="tree-node" data-kind="folder"
                hx-get="{% url 'workspaces:explorer' slug=workspace.slug %}?path={{ entry.path|urlencode }}"
                hx-target="#explorer" hx-swap="outerHTML">
          <span class="tree-icon">
            <svg class="ds-icon ds-icon--xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </span>{{ entry.name }}
        </button>
      {% else %}
        <button type="button" class="tree-node" data-kind="{{ entry.kind }}"
                hx-get="{% url 'workspaces:file' slug=workspace.slug %}?path={{ entry.path|urlencode }}"
                hx-target="#file-view" hx-swap="outerHTML">
          <span class="tree-icon">
            <svg class="ds-icon ds-icon--xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          </span>{{ entry.name }}
        </button>
      {% endif %}
    {% empty %}
      {% if not error %}<p class="board-empty">Dossier vide.</p>{% endif %}
    {% endfor %}
  </div>
</div>
