<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — SpaceLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6fa; --surface:#ffffff; --surface2:#f0f1f7; --border:#e3e4ee;
    --ink:#151522; --muted:#5c5c74; --faint:#8a8aa2;
    --accent:#7c3aed; --accent-ink:#6d28d9; --accent-soft:#ede9fe; --crit:#dc2626;
    --radius:16px; --font:Inter,system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  [data-theme="dark"]{
    --bg:#0a0a12; --surface:#12121c; --surface2:#171728; --border:#24243a;
    --ink:#ecebf5; --muted:#9a9ab5; --faint:#6b6b86;
    --accent:#a855f7; --accent-ink:#c4a8ff; --accent-soft:#1e1633; --crit:#f87171;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;
    display:grid;place-items:center;padding:1.4rem;transition:background .2s,color .2s}
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(60% 50% at 50% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%)}
  .card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);padding:2.2rem;
    box-shadow:0 28px 70px -34px rgba(20,20,40,.4)}
  .top{display:flex;align-items:center;gap:.8rem;margin-bottom:1.6rem}
  .brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.12rem;letter-spacing:-.02em}
  .brand svg{width:24px;height:24px;color:var(--accent)}
  .brand b{background:linear-gradient(92deg,var(--accent),#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .tgl{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
    border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:.15s}
  .tgl:hover{color:var(--ink);border-color:var(--accent)} .tgl svg{width:17px;height:17px}
  h1{font-size:1.45rem;letter-spacing:-.02em;margin-bottom:.3rem}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:1.6rem}
  .field{margin-bottom:1rem}
  .field label{display:block;font:600 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:.4rem}
  .input{width:100%;padding:.7rem .85rem;border-radius:10px;border:1px solid var(--border);background:var(--surface2);
    color:var(--ink);font-size:.95rem;font-family:var(--font);transition:.15s}
  .input:focus{outline:none;border-color:var(--accent);background:var(--surface);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  .btn{width:100%;padding:.75rem;border-radius:10px;border:none;background:var(--accent);color:#fff;
    font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s;margin-top:.4rem}
  .btn:hover{background:var(--accent-ink)}
  .error{background:color-mix(in srgb,var(--crit) 12%,transparent);border:1px solid color-mix(in srgb,var(--crit) 35%,transparent);
    color:var(--crit);padding:.6rem .8rem;border-radius:10px;font-size:.85rem;margin-bottom:1rem}
  .back{display:inline-block;margin-top:1.4rem;font-size:.82rem;color:var(--muted)}
  .back:hover{color:var(--accent)}
  a{color:inherit;text-decoration:none}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <div class="top">
      <span class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Space<b>Labs</b>
      </span>
      <button class="tgl" id="themeBtn" title="Thème clair / sombre" aria-label="Basculer le thème">
        <svg id="thIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <h1>Prendre les commandes</h1>
    <p class="sub">SpaceLabs pilote des agents Claude Code sur cette machine — identifie-toi.</p>

    <form method="post">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      {% if form.non_field_errors %}
        <div class="error">{{ form.non_field_errors.0 }}</div>
      {% endif %}
      <div class="field">
        <label for="{{ form.username.id_for_label }}">Utilisateur</label>
        <input class="input" type="text" name="{{ form.username.html_name }}"
               id="{{ form.username.id_for_label }}" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="{{ form.password.id_for_label }}">Mot de passe</label>
        <input class="input" type="password" name="{{ form.password.html_name }}"
               id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Ouvrir SpaceLabs</button>
    </form>

    <a class="back" href="/">‹ Retour au site</a>
  </div>

  <script>
    (function(){
      const root=document.documentElement, btn=document.getElementById('themeBtn'), ic=document.getElementById('thIcon');
      const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
      const MOON='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      function apply(t){root.setAttribute('data-theme',t);ic.innerHTML=t==='dark'?MOON:SUN;localStorage.setItem('sl-theme',t);}
      apply(localStorage.getItem('sl-theme') || 'light');
      btn.addEventListener('click',()=>apply(root.getAttribute('data-theme')==='dark'?'light':'dark'));
    })();
  </script>
</body>
</html>
