[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    smoke: parcours critiques joues par la QA (job qa-smoke)
    e2e: tests navigateur Playwright (job e2e, vars.E2E_ENABLED)
    regression: suite de non-regression complete
